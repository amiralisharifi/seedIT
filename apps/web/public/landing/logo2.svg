<?xml version="1.0" encoding="UTF-8"?>
<!--
  SEED IT brand mark — hand-traced approximation of the gradient seedling.
  Not a pixel-accurate vector of the source PDF. For production, re-export
  the .ai / .fig original to SVG and replace this file.

  Gradient runs top-left (deep purple #7B2EE5) → mid (blue #4F7AE0)
  → bottom-right (cyan-teal #1AC2D8) — matches the brand PDF.

  Renders well at any size from 16px to 256px; stroke widths scale.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 160"
  fill="none"
  stroke="url(#seedGrad)"
  stroke-width="6"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  <defs>
    <linearGradient
      id="seedGrad"
      x1="18"
      y1="10"
      x2="104"
      y2="156"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#7B2EE5" />
      <stop offset="0.55" stop-color="#3F8AE0" />
      <stop offset="1" stop-color="#1AC2D8" />
    </linearGradient>
  </defs>

  <!-- Left leaf: from top center, swings out, returns to bottom of bulb -->
  <path d="M60 18 C 28 30, 14 60, 22 92 C 30 110, 50 104, 60 92 Z" />

  <!-- Right leaf: mirror -->
  <path d="M60 18 C 92 30, 106 60, 98 92 C 90 110, 70 104, 60 92 Z" />

  <!-- Central spine drops below the leaf bulb -->
  <line x1="60" y1="92" x2="60" y2="116" />

  <!-- Left branch — diagonal then vertical to the dot -->
  <path d="M60 116 L 30 132 L 30 148" />

  <!-- Center branch — straight down -->
  <line x1="60" y1="116" x2="60" y2="148" />

  <!-- Right branch — diagonal then vertical to the dot -->
  <path d="M60 116 L 90 132 L 90 148" />

  <!-- Three open endpoint circles -->
  <circle cx="30" cy="152" r="6" />
  <circle cx="60" cy="152" r="6" />
  <circle cx="90" cy="152" r="6" />
</svg>
